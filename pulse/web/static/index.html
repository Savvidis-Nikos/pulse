<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulse</title>
  <meta name="description" content="Agentic monitoring of the marketplace: what moved, why, and what the agents did about it.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='5' fill='%23c9a35e'/%3E%3Cellipse cx='16' cy='16' rx='13' ry='9' fill='none' stroke='%23c9a35e' stroke-width='1.6'/%3E%3Ccircle cx='28.6' cy='18' r='2.4' fill='%23e8664f'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/newsreader-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script>
    // ?theme=dark or ?theme=light (handy on a projector); otherwise the last choice, otherwise the system setting
    try {
      const q = new URLSearchParams(location.search).get("theme");
      const t = q === "dark" || q === "light" ? q : localStorage.getItem("pulse-theme");
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/briefing" aria-label="Pulse, back to the briefing">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <ellipse cx="16" cy="16" rx="14" ry="9.5" fill="none" stroke="var(--rule-strong)" stroke-width="1.2"/>
        <ellipse cx="16" cy="16" rx="8.5" ry="5.8" fill="none" stroke="var(--rule-strong)" stroke-width="1.2"/>
        <circle cx="16" cy="16" r="4.4" fill="var(--brass)"/>
        <circle cx="29.4" cy="18.6" r="2.3" fill="var(--harm)"/>
        <circle cx="10" cy="11.6" r="1.6" fill="var(--text-2)"/>
      </svg>
      <span class="brand-name">Pulse</span>
    </a>
    <nav class="nav" aria-label="Views">
      <a href="#/briefing" data-view="briefing">Briefing</a>
      <a href="#/investigation" data-view="investigation">Investigations</a>
      <a href="#/graph" data-view="graph">Metric graph</a>
    </nav>
    <div class="status" id="status" aria-live="polite"></div>
  </header>

  <main>
    <section class="view" id="view-briefing" aria-label="CEO briefing"></section>
    <section class="view" id="view-investigation" aria-label="Investigation" hidden></section>
    <section class="view" id="view-graph" aria-label="Metric graph" hidden></section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
